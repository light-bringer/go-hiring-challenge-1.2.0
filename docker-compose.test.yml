services:
  postgres-test:
    image: postgres:17.5
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: challenge
    ports:
      - "5433:5432"
    healthcheck:
      test: pg_isready
      interval: 5s
      timeout: 5s
      retries: 5

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: challenge
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: 5432
      POSTGRES_SQL_DIR: ./sql
      HTTP_PORT: 8485
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "
        cd /app &&
        export POSTGRES_HOST=postgres-test &&
        go run cmd/seed/main.go &&
        go test -v -count=1 ./test/integration/...
      "
